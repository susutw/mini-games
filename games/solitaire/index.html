<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>接龍</title>
  <meta name="description" content="像素風 Klondike 接龍：拖曳或點一下移牌，可選抽 1 張或 3 張。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sudosu.tw/mini-games/games/solitaire/">
  <meta property="og:title" content="接龍">
  <meta property="og:description" content="像素風 Klondike 接龍：拖曳或點一下移牌，可選抽 1 張或 3 張。">
  <meta property="og:image" content="https://sudosu.tw/mini-games/games/solitaire/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="像素風接龍 logo：斜疊的 K、Q、J 像素撲克牌">
  <meta property="og:locale" content="zh_TW">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="../../shared/cards.css">
  <script src="../../shared/pixel-icons.js"></script>
  <script src="../../shared/theme.js"></script>
</head>
<body>
  <main class="container card-page">
    <a class="back" href="../../"><i data-px="arrow-left"></i> 回大廳</a>
    <div class="hud">
      <h1 class="game-logo"><img src="logo.png" alt="接龍" width="392" height="180"></h1>
      <span class="stats">步數 <b id="moves">0</b>　時間 <b id="time">0:00</b>　最佳 <b id="best">—</b></span>
      <div class="modes">
        <button data-draw="1">抽 1 張</button>
        <button data-draw="3">抽 3 張</button>
      </div>
    </div>
    <div id="table"></div>
    <div class="controls">
      <button id="new">新局 <i data-px="retry"></i></button>
      <button id="undo" class="secondary">復原 <i data-px="undo"></i></button>
      <button id="auto" hidden>自動完成 <i data-px="flag"></i></button>
    </div>
    <p class="hint">拖曳移動卡片，點一下會自動放到能放的位置；Ctrl / ⌘ + Z 復原</p>
  </main>
  <script src="../../shared/cards.js"></script>
  <script src="game.js"></script>
</body>
</html>
