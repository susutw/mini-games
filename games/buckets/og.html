<!doctype html>
<!-- og.png 的原始檔：用無頭瀏覽器以 1200×630 截圖產生 -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>連通水桶 OG image</title>
  <script src="../../shared/pixel-icons.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      background: #f6f7fb;
      color: #1f2340;
      display: flex;
      align-items: center;
      padding: 0 64px;
      gap: 32px;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 85% 20%, rgba(59, 156, 240, 0.14), transparent 45%),
        radial-gradient(circle at 10% 90%, rgba(31, 157, 85, 0.12), transparent 40%);
    }
    .text { position: relative; flex: 0 0 520px; }
    .kicker { font-size: 26px; font-weight: 600; color: #6b6f8f; letter-spacing: 1px; }
    h1 { font-size: 104px; font-weight: 800; line-height: 1.1; margin: 10px 0 22px; }
    h1 span { color: #3b9cf0; }
    .desc { font-size: 32px; line-height: 1.5; color: #3a3f63; }
    .desc b { color: #1f9d55; }
    .chips { display: flex; gap: 12px; margin-top: 30px; }
    .chip {
      font-size: 24px;
      font-weight: 600;
      padding: 8px 20px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid #e3e5f0;
    }
    .chip.daily { background: #e84a8a; border-color: #e84a8a; color: #fff; }
    .url { margin-top: 34px; font-size: 24px; color: #6b6f8f; font-weight: 600; }
    .art {
      position: relative;
      flex: 1;
      height: 520px;
      background: #fff;
      border: 2px solid #e3e5f0;
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(31, 35, 64, 0.12);
      overflow: hidden;
    }
    .art svg { width: 100%; height: 100%; }
    .px-icon { vertical-align: -0.2em; }
    .chip { display: inline-flex; align-items: center; gap: 8px; }
    .grid { display: flex; gap: 4px;
      position: absolute;
      top: 24px;
      right: 28px;
      font-size: 30px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="text">
    <div class="kicker"><i data-px="gamepad" data-size="34px"></i> Mini Games</div>
    <h1>連通<span>水桶</span></h1>
    <p class="desc">抓準時機停止放水，<br>讓水位剛好落在<b>安全區間</b>！</p>
    <div class="chips">
      <span class="chip daily"><i data-px="calendar" data-size="28px"></i> 每日挑戰</span>
      <span class="chip"><i data-px="camera" data-size="28px"></i> 分享成績</span>
    </div>
    <div class="url">sudosu.tw/mini-games</div>
  </div>

  <div class="art">
    <div class="grid"><i data-px="sq-hit" data-size="36px"></i><i data-px="sq-hit" data-size="36px"></i><i data-px="sq-low" data-size="36px"></i><i data-px="sq-hit" data-size="36px"></i><i data-px="sq-high" data-size="36px"></i></div>
    <!-- 座標系 540×520 -->
    <svg viewBox="0 0 540 520">
      <!-- 地面與高台 -->
      <rect x="0" y="470" width="540" height="50" fill="#e3e5f0" />
      <rect x="66" y="262" width="88" height="208" rx="4" fill="#e3e5f0" />

      <!-- 左桶的水：紅線以下實色，以上淡色 -->
      <rect x="44" y="150" width="132" height="58" fill="rgba(59,156,240,0.3)" />
      <path d="M44 150 Q 66 142 88 150 T 132 150 T 176 150 V 152 H 44 Z" fill="rgba(59,156,240,0.3)" />
      <rect x="44" y="208" width="132" height="52" fill="#3b9cf0" />

      <!-- 管子與出水口 -->
      <path d="M178 249 H 330 V 270" stroke="#b9bdd8" stroke-width="16" fill="none" stroke-linejoin="round" />
      <path d="M178 249 H 330 V 270" stroke="#3b9cf0" stroke-width="8" fill="none" stroke-linejoin="round" />
      <!-- 閥門（開） -->
      <circle cx="218" cy="249" r="13" fill="#1f9d55" />
      <line x1="209" y1="249" x2="227" y2="249" stroke="#fff" stroke-width="4" stroke-linecap="round" />

      <!-- 水柱 -->
      <rect x="326" y="270" width="8" height="122" fill="#3b9cf0" />

      <!-- 右桶安全區間 -->
      <rect x="306" y="352" width="176" height="44" fill="rgba(31,157,85,0.16)" />
      <line x1="306" y1="352" x2="482" y2="352" stroke="#1f9d55" stroke-width="2.5" stroke-dasharray="9 6" />
      <line x1="306" y1="396" x2="482" y2="396" stroke="#1f9d55" stroke-width="2.5" stroke-dasharray="9 6" />

      <!-- 右桶的水 -->
      <path d="M306 392 Q 328 384 350 392 T 394 392 T 438 392 T 482 392 V 466 H 306 Z" fill="#3b9cf0" />

      <!-- 水花 -->
      <g fill="#3b9cf0">
        <circle cx="312" cy="372" r="4" />
        <circle cx="322" cy="358" r="3" />
        <circle cx="348" cy="366" r="4.5" />
        <circle cx="362" cy="350" r="3" />
        <circle cx="338" cy="352" r="2.5" />
        <circle cx="318" cy="346" r="2.5" />
      </g>

      <!-- 水桶 -->
      <g stroke="#8a8fb3" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <path d="M42 60 V 262 H 178 V 60" />
        <path d="M304 290 V 468 H 484 V 290" />
      </g>
      <!-- 刻度 -->
      <g stroke="#8a8fb3" stroke-width="2.5" opacity="0.5">
        <line x1="42" y1="222" x2="54" y2="222" /><line x1="42" y1="182" x2="54" y2="182" />
        <line x1="42" y1="142" x2="54" y2="142" /><line x1="42" y1="102" x2="54" y2="102" />
        <line x1="304" y1="428" x2="316" y2="428" /><line x1="304" y1="388" x2="316" y2="388" />
        <line x1="304" y1="348" x2="316" y2="348" /><line x1="304" y1="308" x2="316" y2="308" />
      </g>

      <!-- 紅色刻度線 -->
      <line x1="22" y1="208" x2="186" y2="208" stroke="#e5484d" stroke-width="4" />
      <path d="M20 198 L 34 208 L 20 218 Z" fill="#e5484d" />

      <!-- 對勾 -->
      <circle cx="500" cy="374" r="17" fill="#1f9d55" />
      <path d="M492 374 L 498 380 L 509 368" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>
</body>
</html>
