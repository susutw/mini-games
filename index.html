<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Games</title>
  <link rel="stylesheet" href="shared/style.css">
  <script src="shared/pixel-icons.js"></script>
  <script src="shared/theme.js"></script>
  <style>
    h1 { font-size: 2.2rem; margin: 8px 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .card {
      display: block;
      padding: 20px;
      background: var(--panel);
      border-radius: var(--radius);
      color: var(--text);
      text-decoration: none;
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .icon { line-height: 0; }
    .card h2 { margin: 8px 0 4px; font-size: 1.2rem; }
    .card p { margin: 0; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main class="container">
    <h1><i data-px="gamepad" data-size="1.1em"></i> Mini Games</h1>
    <p class="sub">一些有趣的網頁小遊戲</p>
    <div class="grid" id="games"></div>
  </main>
  <script>
    // 新增遊戲時，在這裡加一筆
    const games = [
      { slug: 'snake', icon: 'snake', name: '貪食蛇', desc: '方向鍵或滑動操控，吃越多越長' },
      { slug: 'buckets', icon: 'bucket', name: '連通水桶', desc: '抓準時機停止放水，讓右桶水位剛好落在安全區間' },
      { slug: 'solitaire', icon: 'cards', name: '接龍', desc: '經典 Klondike 接龍，可選抽 1 張或 3 張' },
      { slug: 'freecell', icon: 'freecell', name: '新接龍', desc: 'FreeCell，和 Windows 一樣的 32000 個牌局編號' },
      { slug: 'breakout', icon: 'breakout', name: '打彈珠', desc: '左右移動平板把球彈回去，打破上面所有磚塊' },
    ];
    document.getElementById('games').innerHTML = games.map(g => `
      <a class="card" href="games/${g.slug}/">
        <div class="icon">${px(g.icon, '48px')}</div>
        <h2>${g.name}</h2>
        <p>${g.desc}</p>
      </a>`).join('');
  </script>
</body>
</html>
